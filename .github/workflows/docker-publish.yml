name: Build and Push to Docker Hub

on:
  push:
    branches: [ "dev/Github-Issue-2" ]
  workflow_dispatch:

jobs:
  test:
    name: Run Maven Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        working-directory: ./LibraryManagement_v1.2
        run: mvn test -B

  docker:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./LibraryManagement_v1.2
          file: ./LibraryManagement_v1.2/dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/library-management:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/library-management:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
